# Render.com deployment — IntentLens backend (Python web service)
# Frontend deploys separately to Vercel (see frontend/vercel.json)

services:
  - type: web
    name: intentlens-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # ── Neo4j AuraDB ──────────────────────────────────────────────────────
      - key: NEO4J_URI
        sync: false          # paste at dashboard.render.com → Environment
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false

      # ── LLM ──────────────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b

      # ── GitHub (read-only, only needed if re-running ingest) ─────────────
      - key: GITHUB_TOKEN
        sync: false

      # ── Repo config ───────────────────────────────────────────────────────
      - key: REPO_OWNER
        value: redis
      - key: REPO_NAME
        value: redis
      - key: SUBSYSTEM_PATHS
        value: "src/replication.c,src/rdb.c,src/aof.c,redis.conf"

      # ── CORS — set to your Vercel URL after first deploy ─────────────────
      # Replace the placeholder below with your real Vercel URL, e.g.:
      # https://intentlens.vercel.app,https://intentlens-git-main-yourname.vercel.app
      - key: ALLOWED_ORIGINS
        value: "https://intentlens.vercel.app"

      # ── Behaviour ─────────────────────────────────────────────────────────
      - key: MAX_GRAPH_HOPS
        value: "3"
      - key: REFUSAL_THRESHOLD
        value: "0.35"
      - key: CACHE_DIR
        value: "data/cache"
