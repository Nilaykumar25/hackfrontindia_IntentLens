# Render.com deployment config for the IntentLens backend.
# Frontend deploys separately to Vercel (see docs/DEPLOY.md).
services:
  - type: web
    name: intentlens-api
    env: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: GITHUB_TOKEN
        sync: false
      - key: REPO_OWNER
        value: redis
      - key: REPO_NAME
        value: redis
      - key: LLM_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: ALLOWED_ORIGINS
        value: https://intentlens.vercel.app
